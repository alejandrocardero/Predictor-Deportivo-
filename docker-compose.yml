services:
  predictor:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Pass API keys via .env file or shell environment
      # NEVER put secrets directly in this file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - THE_ODDS_API_KEY=${THE_ODDS_API_KEY:-}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - HF_API_KEY=${HF_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/predict"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
